<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cek Nilai Siswa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#0a0906; --bg-2:#1c1712;
    --accent-glow: rgba(201,162,39,0.28);
    --gold:#d4af37; --gold-bright:#f5dd9c; --gold-deep:#8a6a1f;
    --card-bg: rgba(212,175,55,0.05);
    --card-border: rgba(212,175,55,0.28);
    --text-main:#f4ecd8; --text-sub:#b3a582;
    --danger:#ef4444; --radius:16px;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh;
    font-family:'Inter', sans-serif; color:var(--text-main);
    background:
      radial-gradient(circle at 15% 10%, var(--accent-glow), transparent 42%),
      radial-gradient(circle at 88% 78%, rgba(212,175,55,0.14), transparent 45%),
      linear-gradient(160deg, var(--bg-1), var(--bg-2));
    background-attachment: fixed;
    display:flex; flex-direction:column; align-items:center;
    padding: 40px 16px 80px;
  }
  header{ text-align:center; margin-bottom:32px; }
  header .eyebrow{
    display:inline-block; font-family:'Cormorant Garamond', serif; font-weight:600;
    font-size:.85rem; letter-spacing:.35em; text-transform:uppercase;
    color:var(--gold-bright); margin-bottom:10px;
  }
  header h1{
    font-family:'Playfair Display', serif; font-weight:600; font-style:italic;
    font-size:clamp(1.8rem,4.4vw,2.7rem); margin:0 0 14px;
    background:linear-gradient(100deg,#f5dd9c 0%,#d4af37 35%,#fff6da 55%,#b8892f 75%,#f5dd9c 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  header .divider{ display:flex; align-items:center; justify-content:center; gap:10px; margin:0 0 14px; }
  header .divider::before, header .divider::after{
    content:''; height:1px; width:64px; background:linear-gradient(90deg, transparent, var(--gold));
  }
  header .divider::after{ background:linear-gradient(90deg, var(--gold), transparent); }
  header .divider span{ width:7px; height:7px; background:var(--gold); transform:rotate(45deg); box-shadow:0 0 8px var(--accent-glow); }
  header p{ color:var(--text-sub); margin:0; font-size:.95rem; font-family:'Cormorant Garamond', serif; }

  .card{
    position:relative; width:100%; max-width:560px;
    background:var(--card-bg); border:1px solid var(--card-border);
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border-radius:var(--radius); padding:28px; margin-bottom:24px;
    box-shadow:0 20px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(245,221,156,.08);
  }
  .field{ margin-bottom:18px; }
  .field label{
    display:block; font-size:.78rem; font-weight:600; color:var(--gold-bright);
    margin-bottom:8px; letter-spacing:.12em; text-transform:uppercase;
  }
  select, button, input[type="text"]{
    width:100%; padding:13px 16px; border-radius:12px;
    border:1px solid rgba(255,255,255,.15); font-size:.95rem;
    font-family:'Inter', sans-serif; outline:none;
  }
  input[type="text"], select{
    background:rgba(10,9,6,.55); color:var(--text-main);
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  input[type="text"]::placeholder{ color:rgba(179,165,130,.55); }
  input[type="text"]:hover, input[type="text"]:focus, select:hover, select:focus{
    border-color:var(--gold); box-shadow:0 0 0 3px var(--accent-glow);
  }
  select{
    appearance:none; -webkit-appearance:none; cursor:pointer;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9' viewBox='0 0 14 9'><path d='M1 1l6 6 6-6' stroke='%23d4af37' stroke-width='2' fill='none' fill-rule='evenodd'/></svg>");
    background-repeat:no-repeat; background-position:right 16px center;
  }
  select option{ background:#1c1712; color:#f4ecd8; }
  .hint{ font-size:.76rem; color:var(--text-sub); margin-top:6px; }

  #cariBtn{
    background:linear-gradient(100deg,#b8892f,var(--gold) 35%,var(--gold-bright) 55%,var(--gold) 75%,#b8892f);
    color:#1c1712; font-weight:700; border:none; cursor:pointer; letter-spacing:.04em;
    display:flex; align-items:center; justify-content:center; gap:8px;
    transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease;
    box-shadow:0 10px 25px var(--accent-glow);
  }
  #cariBtn:hover:not(:disabled){ transform:translateY(-2px); box-shadow:0 14px 32px rgba(212,175,55,.45); }
  #cariBtn:disabled{ opacity:.6; cursor:not-allowed; }
  .spinner{
    width:16px; height:16px; border:2px solid rgba(28,23,18,.35); border-top-color:#1c1712;
    border-radius:50%; animation:spin .7s linear infinite; display:none;
  }
  .spinner.show{ display:inline-block; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  #message{
    width:100%; max-width:560px; text-align:center; padding:14px 18px;
    border-radius:12px; font-size:.9rem; margin-bottom:20px; display:none;
  }
  #message.error{ display:block; background:rgba(239,68,68,.12); border:1px solid rgba(239,68,68,.35); color:#fca5a5; }
  #message.info{ display:block; background:rgba(212,175,55,.1); border:1px solid rgba(212,175,55,.35); color:#f5dd9c; }

  /* ===== Hasil ===== */
  .results-wrap{
    width:100%; max-width:720px; display:none;
    background:var(--card-bg); border:1px solid var(--card-border);
    border-radius:var(--radius); overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(245,221,156,.08);
  }
  .student-head{
    padding:22px 24px; border-bottom:1px solid var(--card-border);
    background:linear-gradient(90deg, rgba(212,175,55,.08), transparent 70%);
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;
  }
  .student-head h2{
    font-family:'Playfair Display', serif; font-style:italic; font-weight:600;
    font-size:1.4rem; margin:0 0 4px; color:var(--gold-bright);
  }
  .student-head .meta{ font-size:.85rem; color:var(--text-sub); }
  .print-btn{
    width:auto; padding:9px 18px; font-size:.82rem; cursor:pointer;
    background:rgba(212,175,55,.08); border:1px solid var(--card-border); color:var(--gold-bright);
  }
  .print-btn:hover{ background:rgba(212,175,55,.16); }

  .stat-cards{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; padding:18px 24px 6px; }
  .stat-card{
    background:rgba(212,175,55,.06); border:1px solid rgba(212,175,55,.2);
    border-radius:12px; padding:12px; text-align:center;
  }
  .stat-card small{ display:block; font-size:.68rem; letter-spacing:.1em; text-transform:uppercase; color:var(--text-sub); }
  .stat-card b{ font-family:'Playfair Display', serif; font-size:1.5rem; color:var(--gold-bright); }

  .table-scroll{ overflow-x:auto; }
  table{ width:100%; border-collapse:collapse; margin-top:12px; }
  thead th{
    text-align:left; font-size:.72rem; text-transform:uppercase; letter-spacing:.1em;
    color:var(--gold-bright); padding:12px 20px; background:rgba(212,175,55,.06);
    border-bottom:1px solid rgba(212,175,55,.3); white-space:nowrap;
  }
  tbody td{ padding:14px 20px; font-size:.9rem; border-top:1px solid rgba(212,175,55,.1); vertical-align:middle; }
  tbody tr:hover{ background:rgba(212,175,55,.06); }
  th.c, td.c{ text-align:center; }

  .bar{ height:8px; border-radius:99px; background:rgba(255,255,255,.08); overflow:hidden; min-width:90px; }
  .bar i{ display:block; height:100%; border-radius:99px; }
  .nilai-badge{
    display:inline-block; padding:4px 12px; border-radius:999px; font-weight:600;
    font-size:.85rem; border:1px solid transparent;
  }
  .nilai-tinggi{ background:rgba(34,197,94,.12); color:#4ade80; border-color:rgba(34,197,94,.3); }
  .nilai-sedang{ background:rgba(212,175,55,.14); color:#f5dd9c; border-color:rgba(212,175,55,.4); }
  .nilai-rendah{ background:rgba(239,68,68,.12); color:#f87171; border-color:rgba(239,68,68,.3); }
  .bar-tinggi{ background:#22c55e; } .bar-sedang{ background:#d4af37; } .bar-rendah{ background:#ef4444; }

  footer{
    margin-top:40px; color:var(--text-sub); font-size:.8rem;
    font-family:'Cormorant Garamond', serif; font-style:italic; text-align:center;
  }

  @media (max-width:560px){
    .card{ padding:20px; }
    .stat-cards{ grid-template-columns:repeat(2,1fr); padding:14px 16px 4px; }
    thead th, tbody td{ padding:10px 12px; font-size:.82rem; }
    .student-head{ padding:18px 16px; }
  }

  @media print{
    @page{ size:A4; margin:12mm; }
    *{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
    body{ background:#fff !important; color:#0f172a; display:block; padding:0; }
    header, .card, #message, footer, .print-btn{ display:none !important; }
    .results-wrap{ display:block !important; max-width:none; background:#fff; border:1px solid #ccc; box-shadow:none; }
    .student-head{ background:#fff; border-bottom:2px solid #a67c27; }
    .student-head h2{ color:#0f172a; }
    .student-head .meta, .stat-card small{ color:#475569; }
    .stat-card{ background:#faf6e8; border-color:#d9c88a; }
    .stat-card b, thead th{ color:#0f172a; }
    thead th{ background:#faf6e8; }
    tbody td{ border-top:1px solid #e5e5e5; }
    .bar{ background:#eee; }
    .nilai-badge{ color:#0f172a !important; background:#fff !important; border-color:#999 !important; }
  }
</style>
</head>
<body>

  <header>
    <span class="eyebrow">Portal Akademik</span>
    <h1>Cek Nilai Siswa</h1>
    <div class="divider"><span></span></div>
    <p>Masukkan No Peserta dan pilih kelas untuk melihat hasil nilai kamu</p>
  </header>

  <div class="card">
    <div class="field">
      <label for="inputUser">No Peserta</label>
      <input type="text" id="inputUser" placeholder="Ketik No Peserta kamu" inputmode="text" autocomplete="off">
      <div class="hint">Tulis No Peserta sesuai kartu peserta (huruf besar/kecil tidak berpengaruh).</div>
    </div>

    <div class="field">
      <label for="selKelas">Kelas</label>
      <select id="selKelas">
        <option value="">— Pilih kelas —</option>
      </select>
    </div>

    <button id="cariBtn" type="button" disabled>
      <span class="spinner" id="spinner"></span>
      <span id="btnLabel">Lihat Nilai</span>
    </button>
  </div>

  <div id="message"></div>

  <div class="results-wrap" id="resultsWrap">
    <div class="student-head">
      <div>
        <h2 id="stName">-</h2>
        <div class="meta" id="stMeta"></div>
      </div>
      <button type="button" class="print-btn" id="printBtn">🖨️ Cetak</button>
    </div>

    <div class="stat-cards" id="statCards"></div>

    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>Mata Pelajaran</th>
            <th class="c">Nilai</th>
            <th>Grafik</th>
          </tr>
        </thead>
        <tbody id="resultsBody"></tbody>
      </table>
    </div>
  </div>

  <footer>Dibuat dengan Google Apps Script &amp; GitHub Pages</footer>

<script>
  // URL Web App Apps Script (sama seperti sebelumnya)
  const API_URL = 'https://script.google.com/macros/s/AKfycbybpAWzR1_wc16J9CGyJrHCw7seCfiBxMy9SlqW-dq2u_j8vYz6ZvJlN5zpmA3rLcqY/exec';

  const inputUser   = document.getElementById('inputUser');
  const selKelas    = document.getElementById('selKelas');
  const cariBtn     = document.getElementById('cariBtn');
  const spinner     = document.getElementById('spinner');
  const btnLabel    = document.getElementById('btnLabel');
  const messageBox  = document.getElementById('message');
  const resultsWrap = document.getElementById('resultsWrap');
  const resultsBody = document.getElementById('resultsBody');

  // Daftar kelas 7A–9J
  ['7','8','9'].forEach(function(g){
    const grp = document.createElement('optgroup');
    grp.label = 'Kelas ' + g;
    'ABCDEFGHIJ'.split('').forEach(function(l){
      const o = document.createElement('option');
      o.value = g + l; o.textContent = g + l;
      grp.appendChild(o);
    });
    selKelas.appendChild(grp);
  });

  function showMessage(text, type){ messageBox.textContent = text; messageBox.className = type; }
  function clearMessage(){ messageBox.textContent = ''; messageBox.className = ''; }
  function setLoading(on){
    cariBtn.disabled = on;
    spinner.classList.toggle('show', on);
    btnLabel.textContent = on ? 'Mencari...' : 'Lihat Nilai';
  }
  function updateBtn(){ cariBtn.disabled = !(inputUser.value.trim() && selKelas.value); }

  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  // Normalisasi: huruf kecil, hapus spasi ganda, hilangkan aksen
  function norm(s){
    return String(s == null ? '' : s).normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .toLowerCase().replace(/\s+/g,' ').trim();
  }
  // Ambil nilai No Peserta dari baris data (toleran terhadap variasi nama header)
  const NOPES_KEYS = ['nopeserta','nomorpeserta','nopes','nomorpes'];
  function getNoPeserta(r){
    for (const k in r){
      if (NOPES_KEYS.indexOf(String(k).toLowerCase().replace(/[^a-z0-9]/g,'')) !== -1) return r[k];
    }
    return undefined;
  }
  function normNo(s){ return String(s == null ? '' : s).toLowerCase().replace(/\s+/g,'').trim(); }

  function parseNilai(v){
    if (typeof v === 'number') return v;
    const n = parseFloat(String(v == null ? '' : v).replace(',','.'));
    return isNaN(n) ? null : n;
  }
  const fmt = x => (Math.round(x*100)/100).toLocaleString('id-ID');
  function level(n){ return n === null ? '' : n >= 75 ? 'tinggi' : n >= 60 ? 'sedang' : 'rendah'; }

  async function apiGet(params){
    const url = new URL(API_URL);
    Object.keys(params).forEach(function(k){ if (params[k]) url.searchParams.set(k, params[k]); });
    const res = await fetch(url.toString());
    if (!res.ok) throw new Error('Gagal menghubungi server (status ' + res.status + ')');
    const json = await res.json();
    if (json.success === false || json.status === 'error') throw new Error(json.message || 'Terjadi kesalahan.');
    return json.data;
  }

  function renderResult(rows, kelas){
    const first = rows[0];
    const nums = rows.map(r => parseNilai(r.nilai)).filter(n => n !== null);

    document.getElementById('stName').textContent = first.nama || inputUser.value.trim();
    document.getElementById('stMeta').textContent =
      'No Peserta ' + getNoPeserta(first) + ' • Kelas ' + (first.kelas || kelas) + (first.sekolah ? ' • ' + first.sekolah : '');

    const cards = [['Mata Pelajaran', rows.length]];
    if (nums.length){
      const avg = nums.reduce((a,b)=>a+b,0) / nums.length;
      cards.push(['Rata-rata', fmt(avg)], ['Tertinggi', fmt(Math.max.apply(null,nums))], ['Terendah', fmt(Math.min.apply(null,nums))]);
    }
    document.getElementById('statCards').innerHTML =
      cards.map(c => '<div class="stat-card"><small>'+c[0]+'</small><b>'+c[1]+'</b></div>').join('');

    const sorted = rows.slice().sort((a,b) => String(a.mataPelajaran).localeCompare(String(b.mataPelajaran)));
    resultsBody.innerHTML = sorted.map(function(r){
      const n = parseNilai(r.nilai), lv = level(n);
      const pct = n === null ? 0 : Math.max(0, Math.min(100, n));
      return '<tr><td>' + escapeHtml(r.mataPelajaran) + '</td>' +
        '<td class="c"><span class="nilai-badge nilai-' + lv + '">' + escapeHtml(r.nilai) + '</span></td>' +
        '<td><div class="bar"><i class="bar-' + lv + '" style="width:' + pct + '%"></i></div></td></tr>';
    }).join('');

    resultsWrap.style.display = 'block';
    resultsWrap.scrollIntoView({behavior:'smooth', block:'start'});
  }

  async function cari(){
    clearMessage();
    resultsWrap.style.display = 'none';
    const user = normNo(inputUser.value), kelas = selKelas.value;
    if (!user || !kelas) return;

    setLoading(true);
    try{
      const data = await apiGet({action:'getData', kelas:kelas, mapel:''});
      if (!data || !data.length){
        showMessage('Belum ada data nilai untuk kelas ' + kelas + '.', 'error');
        return;
      }
      // Cocokkan HANYA dengan kolom No Peserta (bukan nama)
      if (getNoPeserta(data[0]) === undefined){
        showMessage('Data dari server belum memuat kolom "No Peserta". Tambahkan kolom tersebut di Apps Script (mis. noPeserta).', 'error');
        return;
      }
      const rows = data.filter(r => normNo(getNoPeserta(r)) === user);
      if (!rows.length){
        showMessage('No Peserta "' + inputUser.value.trim() + '" tidak ditemukan di kelas ' + kelas + '. Periksa nomor dan kelasnya.', 'error');
        return;
      }
      renderResult(rows, kelas);
    }catch(e){
      showMessage('Gagal memuat data dari server: ' + e.message, 'error');
    }finally{
      setLoading(false);
      updateBtn();
    }
  }

  inputUser.addEventListener('input', updateBtn);
  selKelas.addEventListener('change', updateBtn);
  cariBtn.addEventListener('click', cari);
  inputUser.addEventListener('keydown', function(e){ if (e.key === 'Enter' && !cariBtn.disabled) cari(); });
  document.getElementById('printBtn').addEventListener('click', function(){ window.print(); });
</script>

</body>
</html>
